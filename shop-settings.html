<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings — CoolCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--border:#1e1e1e;--border2:#333;--ink:#ededed;--ink2:#a3a3a3;--muted:#737373;--green:#22c55e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Inter',system-ui,sans-serif}
    h1,h2,.brand{font-family:'Inter',system-ui,sans-serif;font-weight:700}
    a{color:var(--ink2);text-decoration:none}a:hover{color:#fff}
    .nav{height:72px;display:flex;align-items:center;justify-content:space-between;max-width:1280px;margin:auto;padding:0 26px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
    .brand{font-weight:700;letter-spacing:0.5px;font-size:24px;color:#fff;text-transform:lowercase}.brand b{color:#fff;font-weight:900}
    .wrap{max-width:700px;margin:auto;padding:28px 24px 60px}
    h1{font-size:28px;letter-spacing:-0.5px;margin:0 0 6px;color:#fff}
    .sub{color:var(--ink2);margin-bottom:24px;font-size:14px}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px 26px;margin-bottom:18px}
    .card h2{font-size:16px;margin:0 0 16px;color:#fff}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{margin-bottom:14px}
    .field label{display:block;font-weight:600;font-size:12px;color:var(--ink2);margin-bottom:6px;letter-spacing:0.3px;text-transform:uppercase}
    .field input,.field textarea,.field select{width:100%;border:1px solid var(--border2);border-radius:10px;padding:10px 14px;font:400 14px/1.5 'Inter',sans-serif;background:var(--bg);color:var(--ink);transition:all 0.2s}
    .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--muted)}
    .field.full{grid-column:1/-1}
    .btn{display:inline-block;background:#fff;color:#000;font:600 14px 'Inter',sans-serif;border:0;border-radius:10px;padding:14px 28px;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px}
    .btn:hover{background:#e5e5e5;transform:translateY(-1px)}
    .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:14px 26px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.2s;z-index:100}
    .toast.show{opacity:1}
    @media(max-width:680px){.wrap{padding:20px 16px}h1{font-size:24px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="/shop-dashboard.html">cool<b>care</b></a>
  <div><a href="/shop-dashboard.html" style="font-size:12px;font-weight:600;color:var(--muted)">← Dashboard</a></div>
</nav>
<div class="wrap">
  <h1>Shop Settings</h1>
  <p class="sub">Manage your business profile and preferences.</p>

  <div class="card">
    <h2>Business Information</h2>
    <div class="grid">
      <div class="field"><label>Shop Name</label><input id="shop_name" type="text"></div>
      <div class="field"><label>Owner Name</label><input id="owner_name" type="text"></div>
      <div class="field"><label>Phone</label><input id="mobile" type="tel"></div>
      <div class="field"><label>Email</label><input id="email" type="email" disabled style="opacity:0.6"></div>
      <div class="field full"><label>Address</label><input id="address" type="text"></div>
      <div class="grid">
        <div class="field"><label>City</label><input id="city" type="text"></div>
        <div class="field"><label>GST Number</label><input id="gst_number" type="text" placeholder="Optional"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Branding</h2>
    <div class="field"><label>Logo URL</label><input id="logo_url" type="url" placeholder="https://example.com/logo.png"></div>
  </div>

  <div class="card">
    <h2>Localization</h2>
    <div class="grid">
      <div class="field"><label>Language</label>
        <select id="language"><option value="en">English</option><option value="hi">Hindi</option><option value="ar">Arabic</option></select>
      </div>
      <div class="field"><label>Currency</label>
        <select id="currency"><option value="USD">USD ($)</option><option value="INR">INR (₹)</option><option value="KWD">KWD</option><option value="AED">AED</option></select>
      </div>
      <div class="field"><label>Timezone</label>
        <select id="timezone">
          <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
          <option value="Asia/Dubai">Asia/Dubai (GST)</option>
          <option value="Asia/Kuwait">Asia/Kuwait (AST)</option>
          <option value="America/New_York">America/New_York (EST)</option>
          <option value="America/Los_Angeles">America/Los_Angeles (PST)</option>
          <option value="Europe/London">Europe/London (GMT)</option>
          <option value="UTC">UTC</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="saveBtn" onclick="saveSettings()">Save Settings</button>
</div>

<div class="toast" id="toast"></div>

<script>
const token = localStorage.getItem('cc_token');
if (!token) window.location.href = '/login.html';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function loadSettings() {
  try {
    const res = await fetch('/api/shop?action=shop-settings', { headers: { Authorization: `Bearer ${token}` } });
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    const data = await res.json();
    const s = data.settings || {};
    ['shop_name','owner_name','mobile','email','address','city','gst_number','logo_url'].forEach(f => {
      const el = document.getElementById(f);
      if (el && s[f] !== undefined && s[f] !== null) el.value = s[f];
    });
    if (s.language) document.getElementById('language').value = s.language;
    if (s.currency) document.getElementById('currency').value = s.currency;
    if (s.timezone) document.getElementById('timezone').value = s.timezone;
  } catch (err) { console.error('Failed to load settings:', err); }
}

async function saveSettings() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const body = {};
  ['shop_name','owner_name','mobile','address','city','gst_number','logo_url','language','currency','timezone'].forEach(f => {
    const el = document.getElementById(f);
    if (el) body[f] = el.value;
  });
  try {
    const res = await fetch('/api/shop', {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'save-shop-settings', ...body }),
    });
    if (res.ok) showToast('Settings saved successfully!');
    else showToast('Failed to save settings');
  } catch (err) { showToast('Network error'); }
  btn.disabled = false; btn.textContent = 'Save Settings';
}

loadSettings();
</script>
</body>
</html>
