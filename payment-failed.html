<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Failed — CoolCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--bg2:#111111;--border:#1e1e1e;--border2:#333;--ink:#ededed;--ink2:#a3a3a3;--muted:#737373;--red:#ef4444}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);font:15px/1.6 'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:48px 40px;max-width:480px;width:100%;text-align:center}
    .icon{width:72px;height:72px;border-radius:50%;background:rgba(239,68,68,0.1);border:2px solid rgba(239,68,68,0.3);display:grid;place-items:center;margin:0 auto 24px}
    .icon svg{width:36px;height:36px;stroke:var(--red);stroke-width:2.5;fill:none}
    h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:8px;color:#fff}
    .sub{color:var(--ink2);font-size:15px;margin-bottom:28px;line-height:1.7}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-block;font:600 14px 'Inter',sans-serif;border-radius:10px;padding:14px 28px;cursor:pointer;text-decoration:none;transition:all 0.2s;letter-spacing:0.3px}
    .btn-primary{background:#fff;color:#000;border:0}.btn-primary:hover{background:#e5e5e5;transform:translateY(-1px)}
    .btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--border2)}.btn-ghost:hover{border-color:#555;color:#fff}
    .help{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1.7}
    @media(max-width:480px){.card{padding:36px 24px}h1{font-size:24px}.btns{flex-direction:column}.btn{width:100%;text-align:center}}
  </style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </div>
  <h1>Payment Failed</h1>
  <p class="sub">We couldn't process your payment. Please try again or use a different payment method.</p>
  <div class="btns">
    <a href="/index.html#pricing" class="btn btn-primary">Try Again →</a>
    <a href="/login.html" class="btn btn-ghost">Back to Login</a>
  </div>
  <div class="help">
    <p>If the problem persists, contact us at <strong style="color:var(--ink2)">support@coolcare.ai</strong></p>
    <p style="margin-top:6px">Common reasons: insufficient funds, incorrect card details, or bank security restrictions.</p>
  </div>
</div>
<script>
  // Clear any stored auth tokens — payment failed, no session should exist
  localStorage.removeItem('cc_token');
  localStorage.removeItem('cc_shop');
  localStorage.removeItem('cc_user');
  sessionStorage.removeItem('cc_checkout_shop');
  sessionStorage.removeItem('cc_pending_checkout');
  console.log('[payment-failed] Cleared auth tokens');
</script>
</body>
</html>
