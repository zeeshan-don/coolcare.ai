<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Referrals — CoolCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--border:#1e1e1e;--border2:#333;--ink:#ededed;--ink2:#a3a3a3;--muted:#737373;--green:#22c55e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Inter',system-ui,sans-serif}
    h1,h2,h3,.brand{font-family:'Inter',system-ui,sans-serif;font-weight:700}
    a{color:var(--ink2);text-decoration:none}a:hover{color:#fff}
    .nav{height:72px;display:flex;align-items:center;justify-content:space-between;max-width:1280px;margin:auto;padding:0 26px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
    .brand{font-weight:700;letter-spacing:0.5px;font-size:24px;color:#fff;text-transform:lowercase}.brand b{color:#fff;font-weight:900}
    .nav-right{display:flex;align-items:center;gap:16px}
    .wrap{max-width:900px;margin:auto;padding:28px 24px 60px}
    h1{font-size:28px;letter-spacing:-0.5px;margin:0 0 6px;color:#fff}
    .sub{color:var(--ink2);margin-bottom:24px;font-size:14px}
    .code-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px;text-align:center;margin-bottom:24px}
    .code{font-size:32px;font-weight:800;letter-spacing:2px;color:#fff;margin-bottom:8px}
    .code-sub{color:var(--muted);font-size:12px;margin-bottom:16px}
    .copy-btn{background:#fff;color:#000;border:0;border-radius:8px;padding:10px 20px;font:600 13px inherit;cursor:pointer;transition:all 0.2s}
    .copy-btn:hover{background:#e5e5e5}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
    .stat-value{font-size:28px;font-weight:800;color:#fff;margin-bottom:4px}
    .stat-label{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px 26px;margin-bottom:18px}
    .card h2{font-size:16px;margin:0 0 16px;color:#fff}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--border)}
    td{padding:12px;border-bottom:1px solid var(--border);color:var(--ink2)}
    tr:last-child td{border-bottom:0}
    .badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:600}
    .badge.completed{background:rgba(34,197,94,0.1);color:var(--green);border:1px solid rgba(34,197,94,0.2)}
    .badge.pending{background:rgba(255,255,255,0.05);color:var(--ink2);border:1px solid var(--border2)}
    .badge.expired{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
    .empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:14px 26px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.2s;z-index:100}
    .toast.show{opacity:1}
    @media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.code{font-size:24px}}
  </style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="/shop-dashboard.html">cool<b>care</b></a>
  <div class="nav-right">
    <a href="/shop-dashboard.html" style="font-size:12px;font-weight:600;color:var(--muted)">← Dashboard</a>
  </div>
</nav>
<div class="wrap">
  <h1>Referral Program</h1>
  <p class="sub">Invite other repair shops and earn rewards when they subscribe.</p>

  <div class="code-box">
    <div class="code" id="refCode">—</div>
    <div class="code-sub">Your unique referral code</div>
    <button class="copy-btn" onclick="copyCode()">Copy Code</button>
    <button class="copy-btn" style="background:var(--bg3);color:var(--ink2);border:1px solid var(--border2);margin-left:8px" onclick="copyLink()">Copy Link</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total Referrals</div></div>
    <div class="stat"><div class="stat-value" id="statSuccessful">0</div><div class="stat-label">Successful</div></div>
    <div class="stat"><div class="stat-value" id="statPending">0</div><div class="stat-label">Pending</div></div>
    <div class="stat"><div class="stat-value" id="statEarnings">$0</div><div class="stat-label">Earnings</div></div>
  </div>

  <div class="card">
    <h2>Referral History</h2>
    <div id="historyTable"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const token = localStorage.getItem('cc_token');
if (!token) window.location.href = '/login.html';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function copyCode() {
  const code = document.getElementById('refCode').textContent;
  navigator.clipboard.writeText(code).then(() => showToast('Code copied!'));
}

function copyLink() {
  const link = window._shareLink || '';
  navigator.clipboard.writeText(link).then(() => showToast('Link copied!'));
}

async function loadReferrals() {
  try {
    const res = await fetch('/api/shop?action=referrals', { headers: { Authorization: `Bearer ${token}` } });
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    const data = await res.json();

    document.getElementById('refCode').textContent = data.referralCode || 'N/A';
    window._shareLink = data.shareLink || '';
    document.getElementById('statTotal').textContent = data.stats?.total || 0;
    document.getElementById('statSuccessful').textContent = data.stats?.successful || 0;
    document.getElementById('statPending').textContent = data.stats?.pending || 0;
    document.getElementById('statEarnings').textContent = '$' + (data.stats?.earnings || 0).toFixed(2);

    const history = data.history || [];
    if (!history.length) {
      document.getElementById('historyTable').innerHTML = '<div class="empty">No referrals yet. Share your code to get started!</div>';
      return;
    }

    document.getElementById('historyTable').innerHTML = `<table><thead><tr><th>Shop</th><th>Date</th><th>Status</th><th>Reward</th></tr></thead><tbody>${
      history.map(r => `<tr>
        <td>${r.referred_shop_name || 'Pending signup'}</td>
        <td>${new Date(r.created_at).toLocaleDateString()}</td>
        <td><span class="badge ${r.status}">${r.status}</span></td>
        <td>${r.status === 'completed' ? '$' + parseFloat(r.reward_value || 0).toFixed(2) : '—'}</td>
      </tr>`).join('')
    }</tbody></table>`;
  } catch (err) {
    document.getElementById('historyTable').innerHTML = '<div class="empty">Failed to load referrals.</div>';
  }
}
loadReferrals();
</script>
</body>
</html>
