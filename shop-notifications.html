<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications — CoolCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;--border:#1e1e1e;--border2:#333;--ink:#ededed;--ink2:#a3a3a3;--muted:#737373;--green:#22c55e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Inter',system-ui,sans-serif}
    h1,.brand{font-family:'Inter',system-ui,sans-serif;font-weight:700}
    a{color:var(--ink2);text-decoration:none}a:hover{color:#fff}
    .nav{height:72px;display:flex;align-items:center;justify-content:space-between;max-width:1280px;margin:auto;padding:0 26px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
    .brand{font-weight:700;letter-spacing:0.5px;font-size:24px;color:#fff;text-transform:lowercase;display:flex;align-items:center}.brand b{color:#fff;font-weight:900}
    .brand-by{font-weight:400;color:#9CA3AF;font-size:14px;opacity:.75;margin-left:8px;margin-right:12px}
    .hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;padding:8px;background:none;border:none}
    .hamburger span{display:block;width:20px;height:2px;background:var(--ink2);border-radius:2px;transition:all 0.3s}
    .hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4px,4px)}
    .hamburger.open span:nth-child(2){opacity:0}
    .hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px)}
    .brand-signature{height:36px;width:auto;vertical-align:middle}
    .mobile-menu{display:none;position:fixed;top:72px;left:0;right:0;background:rgba(10,10,10,0.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:49;padding:12px 20px;flex-direction:column;gap:4px}
    .mobile-menu.open{display:flex}
    .mobile-menu a,.mobile-menu button{display:block;padding:12px 16px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink2);background:transparent;border:none;text-align:left;cursor:pointer;transition:all 0.2s;width:100%;text-decoration:none}
    .mobile-menu a:hover,.mobile-menu button:hover{background:var(--bg3);color:#fff}
    .mobile-menu .divider{border-top:1px solid var(--border);margin:6px 0}
    .wrap{max-width:700px;margin:auto;padding:28px 24px 60px}
    h1{font-size:28px;letter-spacing:-0.5px;margin:0 0 6px;color:#fff}
    .sub{color:var(--ink2);margin-bottom:24px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
    .mark-btn{font:600 12px 'Inter',sans-serif;color:var(--muted);background:transparent;border:1px solid var(--border2);border-radius:8px;padding:7px 14px;cursor:pointer}
    .mark-btn:hover{color:#fff;border-color:#555}
    .notif{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:8px;cursor:pointer;transition:all 0.2s}
    .notif:hover{border-color:var(--border2)}.notif.unread{border-left:3px solid var(--green)}
    .notif-title{font-weight:600;font-size:14px;color:#fff;margin-bottom:4px}
    .notif-msg{font-size:13px;color:var(--ink2);line-height:1.6}
    .notif-time{font-size:11px;color:var(--muted);margin-top:6px}
    .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
    .pager{display:flex;gap:8px;justify-content:center;margin-top:20px}
    .pager button{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:8px 14px;font:500 12px inherit;cursor:pointer;color:var(--muted)}
    .pager button:disabled{opacity:0.3;cursor:not-allowed}
    @media(max-width:680px){
      .wrap{padding:20px 16px}
      h1{font-size:24px}
      .nav a[href*="dashboard"]{display:none}
      .hamburger{display:flex}
      .brand-signature{height:26px}
    }
    /* Demo mode banner */
    .demo-banner{background:rgba(34,197,94,0.08);border-bottom:1px solid rgba(34,197,94,0.2);padding:10px 20px;text-align:center;font-size:13px;font-weight:600;color:var(--green);display:none}
    .demo-banner.show{display:block}
    .demo-banner span{background:rgba(34,197,94,0.15);padding:2px 8px;border-radius:4px;font-size:11px;margin-left:6px}
  </style>
</head>
<body>
<div class="demo-banner" id="demoBanner">
  🧪 Demo Mode — Changes are not saved. <span>READ ONLY</span>
</div>
<nav class="nav">
  <a class="brand" href="/shop-dashboard.html">cool<b>care</b><span class="brand-by">by</span><img src="/zeesh-signature.png" alt="Zeesh" class="brand-signature"></a>
  <div style="display:flex;gap:12px;align-items:center">
    <a href="/shop-dashboard.html" style="font-size:12px;font-weight:600;color:var(--muted)">← Dashboard</a>
    <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>
<div class="mobile-menu" id="mobileMenu">
  <a href="/shop-dashboard.html">Dashboard</a>
  <a href="/shop-channels.html">Communication Channels</a>
  <a href="/shop-sandbox.html">Developer Sandbox</a>
  <a href="/shop-ai-settings.html">AI Settings</a>
  <a href="/shop-settings.html">Settings</a>
  <a href="/shop-referrals.html">Referrals</a>
  <a href="/shop-notifications.html">Notifications</a>
  <div class="divider"></div>
  <button onclick="logout()">Log Out</button>
</div>
<div class="wrap">
  <h1>Notifications</h1>
  <div class="sub">
    <span id="unreadInfo">Loading…</span>
    <button class="mark-btn" onclick="markAllRead()">Mark all as read</button>
  </div>
  <div id="notifList"><div class="empty">Loading…</div></div>
  <div class="pager">
    <button id="prevBtn" onclick="changePage(-1)" disabled>← Prev</button>
    <span id="pageInfo" style="color:var(--muted);padding:8px;font-size:13px">Page 1</span>
    <button id="nextBtn" onclick="changePage(1)">Next →</button>
  </div>
</div>
<script>
const token = localStorage.getItem('cc_token');
if (!token) window.location.href = '/login.html';

// ── Demo mode check ──────────────────────────────────────────────────────────
const isDemo = localStorage.getItem('cc_is_demo') === 'true';
if (isDemo) {
  document.getElementById('demoBanner').classList.add('show');
}

function toggleMobileMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
  document.getElementById('hamburger').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  const menu = document.getElementById('mobileMenu');
  const hamburger = document.getElementById('hamburger');
  if (!hamburger.contains(e.target) && !menu.contains(e.target) && menu.classList.contains('open')) {
    menu.classList.remove('open');
    hamburger.classList.remove('open');
  }
});

function logout() {
  fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify({ action: 'logout' }) }).catch(() => {});
  localStorage.removeItem('cc_token'); localStorage.removeItem('cc_shop'); localStorage.removeItem('cc_user');
  localStorage.removeItem('cc_is_demo');
  window.location.href = '/login.html';
}

let currentPage = 1;

function timeAgo(date) {
  const s = Math.floor((Date.now() - date.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

async function loadNotifications() {
  try {
    const res = await fetch(`/api/shop?action=notifications&page=${currentPage}&limit=20`, { headers: { Authorization: `Bearer ${token}` } });
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    const data = await res.json();
    const list = document.getElementById('notifList');
    const notifs = data.notifications || [];
    document.getElementById('unreadInfo').textContent = data.unreadCount > 0 ? `${data.unreadCount} unread` : 'All caught up!';
    if (!notifs.length) { list.innerHTML = '<div class="empty">No notifications yet.</div>'; return; }
    list.innerHTML = notifs.map(n => `<div class="notif${n.is_read ? '' : ' unread'}" onclick="markRead(${n.id}, this)">
      <div class="notif-title">${n.title || 'Notification'}</div>
      <div class="notif-msg">${n.message || ''}</div>
      <div class="notif-time">${timeAgo(new Date(n.created_at))}</div>
    </div>`).join('');
    const total = data.pagination?.total || 0;
    const totalPages = Math.max(1, Math.ceil(total / 20));
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  } catch (err) {
    document.getElementById('notifList').innerHTML = '<div class="empty">Failed to load notifications.</div>';
  }
}

async function markRead(id, el) {
  if (el?.classList.contains('unread')) {
    el.classList.remove('unread');
    fetch('/api/shop', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'mark-notification-read', notificationId: id }) }).catch(() => {});
  }
}

async function markAllRead() {
  await fetch('/api/shop', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'mark-notification-read', markAll: true }) });
  document.querySelectorAll('.notif.unread').forEach(el => el.classList.remove('unread'));
  document.getElementById('unreadInfo').textContent = 'All caught up!';
}

function changePage(delta) { currentPage += delta; loadNotifications(); }
loadNotifications();
</script>
</body>
</html>
